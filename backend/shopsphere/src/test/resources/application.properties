spring.datasource.url=jdbc:h2:mem:shopsphere;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Wipe the in-memory DB between test-class runs so committed rows left by
# non-transactional tests (e.g. the checkout rollback test) don't leak into
# later runs of the same JVM.
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Test-only JWT configuration.
# The secret is a fixed Base64 value of 64 bytes (512 bits) for tests only —
# production secrets come from the JWT_SECRET environment variable.
jwt.secret=ZGV2LW9ubHktc2VjcmV0LWtleS1mb3Itc2hvcHNwaGVyZS10ZXN0cy0yNTYtYml0cy1taW5pbXVtLWtleS1tYXRlcmlhbA==
jwt.expiration-ms=3600000
# Test image storage: a temp folder per JVM, cleaned on exit.
app.storage.dir=target/test-images
app.storage.public-prefix=/images
