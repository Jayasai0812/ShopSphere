spring.datasource.url=jdbc:h2:mem:shopsphere;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Wipe the in-memory DB between test-class runs so committed rows left by
# non-transactional tests (e.g. the checkout rollback test) don't leak into
# later runs of the same JVM.
spring.jpa.properties.hibernate.globally_quoted_identifiers=false