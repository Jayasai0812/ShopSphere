spring.application.name=shopsphere

spring.datasource.url=jdbc:mysql://localhost:3306/shopsphere_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=com.shopsphere.config.ShopSphereMySqlDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT configuration — secret must be a Base64-encoded key of at least 256 bits,
# supplied via the JWT_SECRET environment variable. Never commit a real secret.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

server.port=8080